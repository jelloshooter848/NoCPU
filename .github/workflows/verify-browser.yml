name: Verify DICE browser distribution
'on':
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
      ref:
        description: Commit to verify (a release passes its tag's commit); defaults to the triggering commit
        type: string
        default: ''
    secrets:
      NOCPU_ROMS_TOKEN:
        description: Read-only token for the private ROM fixtures; without it the ROM browser job is blocked
        required: false
    outputs:
      pages_artifact:
        description: Name of this attempt's Pages artifact, for actions/deploy-pages
        value: ${{ jobs.package.outputs.pages_artifact }}
permissions:
  contents: read
# Job graph (docs/TESTING.md, "Continuous integration"):
#   scope ──────────────┐
#   core-build ─┬─ core-compare (original/native/Wasm; skipped only for docs/UI/packaging/release-metadata-only changes)
#               └─ package ─┬─ browser (chromium | firefox | webkit in parallel)
#   rom-access ─────────────┴─ rom-browser (Stunt Cycle/Indy 4 from private ROMs, chromium + firefox)
#   browser + rom-browser ──── acceptance (the desktop acceptance record of this exact package)
#   verify requires every job, and accepts a skipped core-compare only when
#   scope decided so. scope skips it, on a release too, only when a passing
#   core-compare already recorded (nocpu-compared-<hash> artifact) the same
#   content outside docs, web UI, packaging and release metadata on the same
#   host compiler.
#   rom-browser may be skipped only when the ROM secret is absent and this is
#   not a release; a release also requires a passed acceptance record.
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read lets the lookup list this repository's marker artifacts.
    permissions:
      contents: read
      actions: read
    outputs:
      core: ${{ steps.scope.outputs.core }}
      core_hash: ${{ steps.hash.outputs.core_hash }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - name: Hash this commit's content outside docs, web UI, packaging and release metadata
      id: hash
      run: python3 tools/ci-scope.py hash
    # Content, not a diff: a docs-only push after a cancelled or failed core
    # push has core content that never passed, so it finds no marker. Markers
    # are artifacts, not caches: caches are branch-scoped, so main and later
    # pull requests could never see a marker saved on the working branch or in
    # a pull request. Markers uploaded by fork runs are ignored.
    - name: Look up a passing comparison of exactly this content
      id: marker
      env:
        GITHUB_TOKEN: ${{ github.token }}
        HASH: ${{ steps.hash.outputs.core_hash }}
      run: python3 tools/ci-scope.py lookup --hash "$HASH"
    - name: Decide whether the core comparisons must run (unrecorded content always does)
      id: scope
      env:
        RELEASE: ${{ inputs.release }}
        HIT: ${{ steps.marker.outputs.marker_hit }}
        HASH: ${{ steps.hash.outputs.core_hash }}
      run: python3 tools/ci-scope.py decide --hash "$HASH" --marker-hit "$HIT" --release "$RELEASE"
  core-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The compare and package jobs download the core by this name. "Re-run
    # failed jobs" keeps this job's outputs from the attempt that built it.
    outputs:
      core_artifact: ${{ steps.core-name.outputs.name }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22.22.0
    - name: Install pinned web compiler toolchain
      run: ./tools/install-web-toolchain.sh
    - name: Check preservation, source tooling, and failure-injection tests
      run: make test
    - name: Test web control, preferences and ROM foundations
      run: npm run test:foundations
    - name: Build portable native and Wasm cores
      run: ./tools/build-core.sh all
    - name: Bind the five Wasm transfer files to this exact clean checkout
      run: python3 tools/core-handoff.py --write build/core/core-transfer.json
    - name: Name the core transfer after this run attempt
      id: core-name
      env:
        SHA: ${{ github.sha }}
        ATTEMPT: ${{ github.run_attempt }}
      run: echo "name=core-runtime-transfer-$SHA-$ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload the exact-run core transfer
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.core-name.outputs.name }}
        path: |-
          build/core/core-transfer.json
          build/core/wasm/nocpu.js
          build/core/wasm/nocpu.wasm
          build/core/wasm/build-provenance.json
          build/core/wasm/dependencies.mk
          build/core/wasm/linker.map
        if-no-files-found: error
        retention-days: 7
  core-compare:
    needs:
    - scope
    - core-build
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-24.04
    # Thirteen games (0.3.0) need more than two hours on a 4-vCPU runner: a
    # cancelled run of the 0.3.0 core had used 103 minutes without finishing.
    timeout-minutes: 240
    # actions: read lets the download below find the core of an earlier attempt.
    permissions:
      contents: read
      actions: read
    env:
      # A release that does compare (its core content was never compared)
      # never reads or writes the reference cache: every original is captured
      # fresh. Byte-identical content already compared is skipped by scope.
      NOCPU_REFERENCE_CACHE: ${{ !inputs.release && 'build/reference-cache' || '' }}
      NOCPU_ANALYZE_JOBS: '4'
      NOCPU_REPLAY_JOBS: '4'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22.22.0
    - name: Fetch the core under comparison from this same workflow run (any attempt)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.core-build.outputs.core_artifact }}
        path: build/core
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Reject checkout, tree, version, provenance or byte drift in the Wasm under comparison
      run: python3 tools/core-handoff.py --verify build/core/core-transfer.json
    - name: Build the portable native runner (the Wasm compared is the transferred, browser-tested one)
      run: ./tools/build-core.sh native
    - name: Build original desktop reference
      run: ./tools/build-native.sh --jobs 4
    - name: Release run captures every original fresh
      if: ${{ inputs.release }}
      run: |-
        echo 'Release run: reference cache disabled (NOCPU_REFERENCE_CACHE unset); every original is captured fresh.'
    - name: Key the original reference cache by every capture input
      id: refkey
      if: ${{ !inputs.release }}
      run: echo "key=nocpu-reference-v1-$(python3 tools/reference-cache.py combined-key)" >> "$GITHUB_OUTPUT"
    # Only ROM-free originals are cached (tools/reference-cache.py refuses ROM
    # games). Each entry is re-keyed and its bytes re-hashed before use; a hit
    # skips only the Docker original run of that scenario. Saved archives carry
    # a content suffix, so the primary key never matches exactly and the newest
    # archive for these inputs (or any older one) is restored.
    - name: Restore cached original reference captures
      if: ${{ !inputs.release }}
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: build/reference-cache
        key: ${{ steps.refkey.outputs.key }}
        restore-keys: |-
          ${{ steps.refkey.outputs.key }}-
          nocpu-reference-v1-
    - name: Capture (or restore) and compare every old-four scenario with a measured disk preflight and monitored reserve
      run: |-
        python3 - <<'PY_SPACE'
        import json,os,pathlib,shutil,signal,subprocess,time
        free=shutil.disk_usage('.').free
        pathlib.Path('build/ci-capacity.json').write_text(json.dumps({'free_before_capture_bytes':free,'required_before_bytes':16*1024**3,'reserve_bytes':1024**3,'runner_peak':'not previously measured'})+'\n')
        if free<16*1024**3: raise SystemExit('Insufficient disk for complete retained evidence; no deletion or gate reduction permitted')
        commands='./tools/capture-pong.sh && ./tools/capture-games.sh && python3 tests/test-reference-analysis.py --reference-dir build/reference && make core-compare'
        process=subprocess.Popen(['bash','-eu','-c',commands],start_new_session=True)
        while process.poll() is None:
            if shutil.disk_usage('.').free<1024**3:
                os.killpg(process.pid,signal.SIGTERM)
                try: process.wait(timeout=15)
                except subprocess.TimeoutExpired:
                    os.killpg(process.pid,signal.SIGKILL); process.wait()
                raise SystemExit('Evidence reserve breached; retained partial evidence, no deletion')
            try: process.wait(timeout=15)
            except subprocess.TimeoutExpired: pass
        if shutil.disk_usage('.').free<1024**3: raise SystemExit('Evidence reserve breached at completion; retained evidence')
        raise SystemExit(process.returncode)
        PY_SPACE
    - name: Record that this job does not run the ROM-backed Stunt Cycle/Indy 4 comparisons
      run: python3 -c 'import json,pathlib; pathlib.Path("build/selected-private-fixture-status.json").write_text(json.dumps({"games":["stuntcycle","indy4"],"private_fixture_comparison_in_this_job":"skipped","reason":"This
        job has no ROM fixture access. The ROM-backed original/native/Wasm comparisons run in the separate ROM-backed
        validation workflow (.github/workflows/rom-validation.yml) when the NOCPU_ROMS_TOKEN secret is configured, and
        are reported there as blocked, not passed, when it is absent. ROM-backed captures are never cached."},indent=2)+"\n")'
    - name: Find originals stored by this run
      id: refstore
      if: ${{ !inputs.release }}
      env:
        KEY: ${{ steps.refkey.outputs.key }}
      run: |-
        python3 tools/reference-cache.py prune
        if cat build/reference/reference-cache.jsonl build/reference-games/*/reference-cache.jsonl 2>/dev/null \
            | grep -q '"stored": true'; then
          echo "save=true" >> "$GITHUB_OUTPUT"
          echo "key=$KEY-$(python3 tools/reference-cache.py content-key)" >> "$GITHUB_OUTPUT"
        else
          echo 'No new original captures were stored; the reference cache is not saved again.'
          echo "save=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Save the qualified original captures for later runs
      if: ${{ !inputs.release && steps.refstore.outputs.save == 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: build/reference-cache
        key: ${{ steps.refstore.outputs.key }}
    - name: Record that this exact core content passed its comparisons
      env:
        HASH: ${{ needs.scope.outputs.core_hash }}
        SHA: ${{ inputs.ref || github.sha }}
      run: |-
        mkdir -p build/compared-marker
        printf 'core_hash=%s\ncommit=%s\n' "$HASH" "$SHA" > build/compared-marker/compared.txt
    - name: Upload the comparison marker that lets later docs/UI-only content skip
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: nocpu-compared-${{ needs.scope.outputs.core_hash }}
        path: build/compared-marker/compared.txt
        if-no-files-found: error
        overwrite: true
        retention-days: 30
    - name: Retain verification evidence without executable native builds or private fixtures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: pong-verification-evidence
        path: |
          build/reference/report.json
          build/reference/reference-cache.jsonl
          build/reference/**/evidence.json
          build/reference/**/*.csv
          build/reference/**/*.ppm
          build/reference/**/*.wav
          build/reference/**/*.s16le
          build/reference/**/*.gray
          build/reference/**/*.diff
          build/reference/**/renderer-identity.txt
          build/reference-games/latest.txt
          build/reference-games/**/report.json
          build/reference-games/**/reference-cache.jsonl
          build/reference-games/**/*.tsv
          build/reference-games/**/scenario-manifest.json
          build/reference-games/**/capture-image-id.txt
          build/reference-games/**/renderer-identity.txt
          build/reference-games/**/adapter.diff
          build/reference-games/**/*.json
          build/reference-games/**/*.csv
          build/reference-games/**/*.ppm
          build/reference-games/**/*.wav
          build/reference-games/**/*.s16le
          build/reference-games/**/*.gray
          build/reference-games/**/*.diff
          build/reference-games/**/*.log
          build/native/toolchain-provenance/**
          build/core/comparison.json
          build/core/native/build-provenance.json
          build/core/native/dependencies.mk
          build/core/native/linker.map
          build/core/wasm/build-provenance.json
          build/core/wasm/dependencies.mk
          build/core/wasm/linker.map
          build/core/native-evidence/**/*.json
          build/core/native-evidence/**/*.csv
          build/core/native-evidence/**/*.s16le
          build/core/native-evidence/**/*.gray
          build/core/native-evidence/**/*.ppm
          build/core/native-evidence/**/*.wav
          build/core/wasm-evidence/**/*.json
          build/core/wasm-evidence/**/*.csv
          build/core/wasm-evidence/**/*.s16le
          build/core/wasm-evidence/**/*.gray
          build/core/wasm-evidence/**/*.ppm
          build/core/wasm-evidence/**/*.wav
          build/core/game-evidence/latest.txt
          build/core/game-evidence/**/*.json
          build/core/game-evidence/**/*.csv
          build/core/game-evidence/**/*.ppm
          build/core/game-evidence/**/*.wav
          build/core/game-evidence/**/*.s16le
          build/core/game-evidence/**/*.gray
          build/core/game-evidence/*/*.txt
          build/core/game-evidence/*/*.tsv
          build/core/game-evidence/*/*.log
          build/ci-capacity.json
          build/selected-private-fixture-status.json
          build/core/core-transfer.json
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
  package:
    needs: core-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # The browser jobs download the package by this name and release.yml
    # deploys the Pages artifact by its name; a re-run keeps both.
    outputs:
      package_artifact: ${{ steps.package-name.outputs.name }}
      pages_artifact: ${{ steps.package-name.outputs.pages }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22.22.0
    - name: Install pinned npm dependencies
      run: |-
        mkdir -p build/npm-cache
        npm ci --cache "$PWD/build/npm-cache" --no-audit --no-fund
    - name: Fetch only the tested core from this same workflow run (any attempt)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.core-build.outputs.core_artifact }}
        path: build/core
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Reject checkout, tree, version, provenance or byte drift before using the transferred core
      run: python3 tools/core-handoff.py --verify build/core/core-transfer.json --install-runtime
    - name: Build production frontend at the project Pages path
      env:
        NOCPU_BASE_PATH: /NoCPU/
      run: npm run build:web
    - name: Production bundle carries no dev ROM endpoint, module or embedded ZIP
      run: python3 tests/test-dev-rom-exclusion.py --require-build
    - name: Package source-matched browser preview or qualified release
      env:
        FINAL_RELEASE: ${{ inputs.release }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [ "$FINAL_RELEASE" = true ]; then
          python3 tools/package-web.py --tag "$RELEASE_TAG" --archive-dir build/release
        else
          python3 tools/package-web.py --preview --archive-dir build/release
        fi
    - name: Hash every packaged file and name the package after this run attempt
      id: package-name
      env:
        SHA: ${{ github.sha }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |-
        (cd build && find pages -type f -print0 | sort -z | xargs -0 sha256sum) > build/pages-transfer.sha256
        echo "name=web-package-$SHA-$ATTEMPT" >> "$GITHUB_OUTPUT"
        echo "pages=github-pages-$SHA-$ATTEMPT" >> "$GITHUB_OUTPUT"
    - name: Upload the exact packaged site for the browser engines
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.package-name.outputs.name }}
        path: |-
          build/pages/
          build/pages-transfer.sha256
          build/web-provenance.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    # Publishing (release.yml) needs the verify job below, which requires every
    # browser engine and the core comparison to pass.
    - name: Retain matching source and browser release assets
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: verified-release-assets
        path: build/release/
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Prepare the Pages artifact (deployed only after verify passes)
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
      with:
        name: ${{ steps.package-name.outputs.pages }}
        path: build/pages
        retention-days: 7
  browser:
    needs: package
    name: browser (${{ matrix.engine }})
    runs-on: ubuntu-24.04
    # actions: read lets the download below list this run's artifacts across
    # attempts, so a re-run of one engine alone finds the package built earlier.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine:
        - chromium
        - firefox
        - webkit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22.22.0
    - name: Install pinned npm dependencies and the ${{ matrix.engine }} engine
      env:
        ENGINE: ${{ matrix.engine }}
      run: |-
        mkdir -p build/npm-cache
        npm ci --cache "$PWD/build/npm-cache" --no-audit --no-fund
        PLAYWRIGHT_BROWSERS_PATH=./build/playwright ./node_modules/.bin/playwright install "$ENGINE"
        PLAYWRIGHT_BROWSERS_PATH=./build/playwright ./node_modules/.bin/playwright install-deps "$ENGINE"
    - name: Install a signed-package audio sink for real headless browser audio
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
    - name: Fetch only the packaged site from this same workflow run (any attempt)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.package.outputs.package_artifact }}
        path: build
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Reject missing, extra or changed packaged files
      working-directory: build
      run: |-
        sha256sum --check --strict --quiet pages-transfer.sha256
        diff <(find pages -type f | sort) <(sed 's/^[0-9a-f]*  //' pages-transfer.sha256 | sort)
        echo "Packaged site verified: $(wc -l < pages-transfer.sha256) files"
    - name: Test packaged gameplay, controls, audio, and delivery in ${{ matrix.engine }}
      env:
        NOCPU_TEST_PACKAGED: '1'
        ENGINE: ${{ matrix.engine }}
      run: npm run test:browser -- --project="$ENGINE"
    # Outcomes of the @game-tagged tests, the engine's browser.version() and the
    # runtime digest recomputed from the tested files, bound to this run attempt.
    # Without a usable report collect writes a missing-results marker instead,
    # which replaces any earlier attempt's artifact of the same name.
    - name: Collect desktop acceptance results for ${{ matrix.engine }}
      if: always()
      env:
        ENGINE: ${{ matrix.engine }}
      run: |-
        if [ ! -f tools/desktop-acceptance.py ]; then
          echo 'This commit predates generated desktop acceptance; nothing to collect.'; exit 0
        fi
        python3 tools/desktop-acceptance.py collect --engine "$ENGINE" --source public \
          --report build/browser-matrix.json --identity "build/browser-identity/$ENGINE.json" \
          --site build/pages --output "build/acceptance-inputs/public-$ENGINE.json"
    - name: Retain the desktop acceptance results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-input-public-${{ matrix.engine }}
        path: build/acceptance-inputs/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
    - name: Retain all browser diagnostics and tested package identities
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: browser-verification-evidence-${{ matrix.engine }}
        path: |-
          build/pages/BUILD-MANIFEST.json
          build/web-provenance.json
          build/playwright-report/**
          build/browser-results/**
          build/browser-matrix.json
          build/browser-identity/**
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
  rom-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.secret.outputs.configured }}
    steps:
    - name: Check private ROM fixture access is configured
      id: secret
      env:
        HAS_TOKEN: ${{ secrets.NOCPU_ROMS_TOKEN != '' }}
      run: |-
        if [ "$HAS_TOKEN" = true ]; then
          echo 'configured=true' >> "$GITHUB_OUTPUT"
        else
          echo '::warning title=ROM browser tests blocked::blocked: NOCPU_ROMS_TOKEN not configured; Stunt Cycle/Indy 4 browser play was skipped, not passed.'
          echo '**blocked: NOCPU_ROMS_TOKEN not configured.** Stunt Cycle/Indy 4 browser play was skipped, not passed; no desktop acceptance can pass.' >> "$GITHUB_STEP_SUMMARY"
          echo 'configured=false' >> "$GITHUB_OUTPUT"
        fi
  # Stunt Cycle and Indy 4 played from the private ROMs in the exact package the
  # browser jobs test. ROM bytes, frames and traces stay on the runner: the run
  # is ROM-safe (no traces, videos, screenshots or HTML report) and only the
  # stripped JSON results and the acceptance inputs are uploaded.
  rom-browser:
    needs:
    - package
    - rom-access
    if: needs.rom-access.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Fetch and audit private ROM fixtures into ignored build/roms
      env:
        NOCPU_ROMS_TOKEN: ${{ secrets.NOCPU_ROMS_TOKEN }}
      run: ./tools/fetch-roms.sh
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
      with:
        node-version: 22.22.0
    - name: Install pinned npm dependencies, Chromium and Firefox with a headless audio sink
      run: |-
        mkdir -p build/npm-cache
        npm ci --cache "$PWD/build/npm-cache" --no-audit --no-fund
        PLAYWRIGHT_BROWSERS_PATH=./build/playwright ./node_modules/.bin/playwright install chromium firefox
        PLAYWRIGHT_BROWSERS_PATH=./build/playwright ./node_modules/.bin/playwright install-deps chromium firefox
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
    - name: Fetch only the packaged site from this same workflow run (any attempt)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.package.outputs.package_artifact }}
        path: build
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Reject missing, extra or changed packaged files
      working-directory: build
      run: |-
        sha256sum --check --strict --quiet pages-transfer.sha256
        diff <(find pages -type f | sort) <(sed 's/^[0-9a-f]*  //' pages-transfer.sha256 | sort)
        echo "Packaged site verified: $(wc -l < pages-transfer.sha256) files"
    # NOCPU_TEST_ROM_SAFE turns off traces, videos, failure screenshots and the
    # HTML report (playwright.config.ts): their frames would be ROM-derived.
    - name: Play Stunt Cycle and Indy 4 from the private ROMs in Chromium and Firefox
      env:
        NOCPU_ROM_DIR: build/roms
        NOCPU_TEST_PACKAGED: '1'
        NOCPU_TEST_ROM_SAFE: '1'
      run: |-
        specs=(tests/browser/v060-driving.spec.ts)
        if [ -f tests/browser/browser-identity.spec.ts ]; then specs=(tests/browser/browser-identity.spec.ts "${specs[@]}"); fi
        ./tools/run-browser-tests.sh --project=chromium --project=firefox "${specs[@]}"
    - name: Keep payload-free results only and collect the acceptance inputs
      if: always()
      run: |-
        mkdir -p build/rom-browser-reports
        # Results, errors and JSON evidence only; screenshots are dropped and
        # the filter refuses any output that still carries image data.
        if [ -f build/rom-browser-matrix.json ]; then
          python3 tools/strip-rom-report.py build/rom-browser-matrix.json build/rom-browser-reports/rom-browser-results.json
        fi
        # Without a stripped report, collect writes missing-results markers.
        status=0
        if [ -f tools/desktop-acceptance.py ]; then
          for engine in chromium firefox; do
            python3 tools/desktop-acceptance.py collect --engine "$engine" --source rom \
              --report build/rom-browser-reports/rom-browser-results.json \
              --identity "build/browser-identity/$engine.json" \
              --site build/pages --output "build/acceptance-inputs/rom-$engine.json" || status=1
          done
        fi
        exit "$status"
    - name: Upload the stripped ROM browser results (no ROMs, frames or audio)
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: rom-browser-results
        path: build/rom-browser-reports/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
    - name: Retain the desktop acceptance results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acceptance-input-rom
        path: build/acceptance-inputs/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
  # The desktop acceptance record of the exact package the browser jobs tested
  # (tools/desktop-acceptance.py; policy in tests/release-readiness.json). A
  # release, or any run whose ROM job ran, requires it to pass; release.yml
  # checks it again and publishes it as nocpu-X.Y.Z-acceptance.json.
  acceptance:
    needs:
    - package
    - browser
    - rom-access
    - rom-browser
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - name: Fetch only the packaged site from this same workflow run (any attempt)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ${{ needs.package.outputs.package_artifact }}
        path: build
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Reject missing, extra or changed packaged files
      working-directory: build
      run: |-
        sha256sum --check --strict --quiet pages-transfer.sha256
        diff <(find pages -type f | sort) <(sed 's/^[0-9a-f]*  //' pages-transfer.sha256 | sort)
    - name: Fetch every engine's collected results from this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: acceptance-input-*
        merge-multiple: true
        path: build/acceptance-inputs
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Generate the desktop acceptance record (required to pass on a release)
      env:
        RELEASE: ${{ inputs.release }}
        BROWSER: ${{ needs.browser.result }}
        ROM_BROWSER: ${{ needs.rom-browser.result }}
      run: |-
        if [ ! -f tools/desktop-acceptance.py ]; then
          echo '::notice::This commit predates generated desktop acceptance; no record is produced.'; exit 0
        fi
        version=$(python3 -c 'import json; print(json.load(open("build/pages/BUILD-MANIFEST.json"))["version"])')
        record="build/acceptance/nocpu-$version-acceptance.json"
        mkdir -p build/acceptance-inputs
        require=()
        if [ "$RELEASE" = true ] || [ "$ROM_BROWSER" = success ]; then require=(--require-passed); fi
        status=0
        python3 tools/desktop-acceptance.py combine --inputs build/acceptance-inputs --site build/pages \
          --output "$record" --job browser="$BROWSER" --job rom-browser="$ROM_BROWSER" "${require[@]}" \
          | tee build/acceptance-summary.txt || status=$?
        { echo '### Desktop acceptance'; echo '```'; cat build/acceptance-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
    - name: Retain the desktop acceptance record
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: desktop-acceptance
        path: build/acceptance/
        if-no-files-found: warn
        retention-days: 14
        overwrite: true
  verify:
    needs:
    - scope
    - core-build
    - core-compare
    - package
    - browser
    - rom-access
    - rom-browser
    - acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job; a skipped core comparison only by scope (content already compared)
      env:
        SCOPE: ${{ needs.scope.result }}
        CORE_SCOPE: ${{ needs.scope.outputs.core }}
        BUILD: ${{ needs.core-build.result }}
        COMPARE: ${{ needs.core-compare.result }}
        PACKAGE: ${{ needs.package.result }}
        BROWSER: ${{ needs.browser.result }}
        ROM_ACCESS: ${{ needs.rom-access.result }}
        ROM_CONFIGURED: ${{ needs.rom-access.outputs.configured }}
        ROM_BROWSER: ${{ needs.rom-browser.result }}
        ACCEPTANCE: ${{ needs.acceptance.result }}
        RELEASE: ${{ inputs.release }}
      run: |-
        status=0
        for job in "scope=$SCOPE" "core-build=$BUILD" "package=$PACKAGE" "browser=$BROWSER" \
                   "rom-access=$ROM_ACCESS" "acceptance=$ACCEPTANCE"; do
          if [ "${job#*=}" = success ]; then echo "$job"; else echo "::error::$job"; status=1; fi
        done
        if [ "$COMPARE" = success ]; then
          echo "core-compare=success"
        elif [ "$COMPARE" = skipped ] && [ "$SCOPE" = success ] && [ "$CORE_SCOPE" = false ]; then
          echo "core-compare=skipped by scope: an earlier run passed it for identical content outside docs, web UI, packaging and release metadata (see the scope job). Skipped, not passed here."
          echo '**Core original/native/Wasm comparisons skipped by scope (content already compared; only docs, web UI, packaging or release metadata differ), not passed in this run.**' >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::core-compare=$COMPARE (scope core=$CORE_SCOPE, release=$RELEASE)"
          status=1
        fi
        if [ "$ROM_BROWSER" = success ]; then
          echo "rom-browser=success"
        elif [ "$ROM_BROWSER" = skipped ] && [ "$ROM_ACCESS" = success ] && [ "$ROM_CONFIGURED" = false ] && [ "$RELEASE" != true ]; then
          echo "rom-browser=skipped: blocked, NOCPU_ROMS_TOKEN not configured. Skipped, not passed."
          echo '**ROM browser tests blocked (no NOCPU_ROMS_TOKEN): skipped, not passed; desktop acceptance did not pass.**' >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::rom-browser=$ROM_BROWSER (configured=$ROM_CONFIGURED, release=$RELEASE)"
          status=1
        fi
        exit "$status"

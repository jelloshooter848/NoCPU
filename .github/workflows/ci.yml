name: Repository and DICE browser
permissions:
  contents: read
  # verify-browser.yml's browser job reads this run's artifacts across attempts.
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check VERSION is SemVer and CHANGELOG.md keeps an Unreleased section
      run: python3 tools/release_check.py
  verify:
    uses: ./.github/workflows/verify-browser.yml
    # Only the ROM browser job's fetch step reads it; fork pull requests get none
    # and that job is reported as blocked, not passed.
    secrets:
      NOCPU_ROMS_TOKEN: ${{ secrets.NOCPU_ROMS_TOKEN }}
'on':
  push:
    branches:
    - main
    - restart/desktop-first
  pull_request: null
  workflow_dispatch: null

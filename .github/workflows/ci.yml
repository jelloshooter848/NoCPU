name: Repository and DICE browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Deploy this explicitly reviewed commit as the three-game preview for physical-device testing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify-browser.yml

  deploy-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.repository == 'jelloshooter848/NoCPU'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the tested preview with pending physical-device results visible in its manifest
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# Branch/PR checks never publish. Preview deployment requires an explicit dispatch.

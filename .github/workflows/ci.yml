name: Repository and native reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preservation, metadata, and public payloads
        run: make test
      - name: Build the isolated original native reference
        run: ./tools/build-native.sh --jobs 2
      - name: Capture ROM-free Pong reference behavior
        run: ./tools/capture-pong.sh
      - name: Retain native reference evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pong-native-reference
          path: |
            build/reference/report.json
            build/reference/**/evidence.json
            build/reference/**/*.csv
            build/reference/**/*.ppm
            build/reference/**/*.wav
            build/reference/**/*.diff
            build/native/toolchain-provenance/packages.tsv
            build/native/toolchain-provenance/base-image.txt
            build/native/toolchain-provenance/binary.sha256
            build/native/toolchain-provenance/check.txt
            build/native/toolchain-provenance/image-id.txt
            build/native/toolchain-provenance/apt-release/**
          if-no-files-found: error
          retention-days: 14

# No private ROM checkout, credentials, or browser deployment is part of public CI.

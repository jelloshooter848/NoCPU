name: Verified DICE release and Pages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify-browser.yml
    with:
      release: true
      release_tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch verified matching source and browser assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: release-assets
      - name: Check downloaded asset integrity
        working-directory: release-assets
        run: sha256sum --check *.sha256
      - name: Publish qualified DICE release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "NoCPU $RELEASE_TAG" \
            --notes-file release-assets/RELEASE-NOTES.md \
            release-assets/*.tar.gz release-assets/*.sha256

  deploy-pages:
    needs: [verify, publish]
    if: github.repository == 'jelloshooter848/NoCPU'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the exact artifact that passed the tagged release checks
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# Repository publication and Pages permissions are isolated from verification.

name: Verified source release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check preservation and tooling
        run: make test
      - name: Build native reference
        run: ./tools/build-native.sh --jobs 2
      - name: Verify ROM-free Pong reference
        run: ./tools/capture-pong.sh
      - name: Package matching version and cleared license audit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/package-release.py --tag "$RELEASE_TAG"
      - name: Retain validated source assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch validated source assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: release-assets
      - name: Check downloaded asset integrity
        working-directory: release-assets
        run: sha256sum --check *.sha256
      - name: Publish the tagged source foundation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "NoCPU $RELEASE_TAG" \
            --notes-file release-assets/RELEASE-NOTES.md \
            release-assets/*.tar.gz release-assets/*.sha256

# Publication occurs only after an explicitly pushed tag passes all checks.

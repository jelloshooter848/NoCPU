# Verifies, publishes and deploys a release (docs/RELEASING.md). Runs when the owner pushes a
# version tag, or by hand (Actions -> Release -> Run workflow) with an existing tag to retry,
# redeploy or roll back. Branch pushes never deploy. Tags are never moved; a failed release is
# fixed by the next patch release.
name: Release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify, publish and deploy (for example v0.2.0)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
    - name: Require a release tag ref
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |-
        if [ "$EVENT" = push ] && [ "$REF" != "refs/tags/$TAG" ]; then
          echo "::error::$REF is not a tag push"; exit 1
        fi
        case "$TAG" in
          v[0-9]*) ;;
          *) echo "::error::$TAG is not a vX.Y.Z release tag"; exit 1 ;;
        esac
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: refs/tags/${{ inputs.tag || github.ref_name }}
        fetch-depth: 0
    - name: Resolve the tag to its commit
      id: tag
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |-
        git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || { echo "::error::$TAG is not a tag"; exit 1; }
        commit=$(git rev-parse "refs/tags/$TAG^{commit}")
        [ "$(git rev-parse HEAD)" = "$commit" ] || { echo "::error::checkout is not $TAG"; exit 1; }
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
    - name: Check the tag against VERSION and its dated CHANGELOG.md section
      env:
        TAG: ${{ steps.tag.outputs.tag }}
      run: |-
        mkdir -p build/release-notes
        python3 tools/release_check.py --tag "$TAG"
        python3 tools/release_check.py --tag "$TAG" --notes > build/release-notes/notes.md
        cat build/release-notes/notes.md
    - name: Retain the release notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-notes
        path: build/release-notes/notes.md
        if-no-files-found: error
        retention-days: 7
  verify:
    needs: resolve
    uses: ./.github/workflows/verify-browser.yml
    with:
      release: true
      release_tag: ${{ needs.resolve.outputs.tag }}
      ref: ${{ needs.resolve.outputs.commit }}
    # The ROM browser job plays Stunt Cycle and Indy 4 in the exact release
    # package; a release cannot pass desktop acceptance without it.
    secrets:
      NOCPU_ROMS_TOKEN: ${{ secrets.NOCPU_ROMS_TOKEN }}
  publish:
    needs:
    - resolve
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: read lets the downloads below find this run's artifacts from an
    # earlier attempt, so "Re-run failed jobs" can retry a failed publish.
    permissions:
      contents: write
      actions: read
    steps:
    - name: Fetch the verified browser, source and checksum assets
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: verified-release-assets
        path: release-assets
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Fetch the checked release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-notes
        path: release-notes
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Check downloaded asset integrity
      working-directory: release-assets
      run: sha256sum --check -- *.sha256
    - name: Fetch the desktop acceptance record generated by this run's browser jobs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: desktop-acceptance
        path: acceptance
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
      # A tag from before generated acceptance has no record; the next step
      # decides from the policy the build itself ships whether one is required.
      continue-on-error: true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ needs.resolve.outputs.commit }}
        path: source
    - name: Refuse to publish without a passing desktop acceptance record for this exact build
      env:
        TAG: ${{ needs.resolve.outputs.tag }}
      run: |-
        version=${TAG#v}
        zip="release-assets/nocpu-$version-web.zip"
        policy=$(python3 -c 'import json,sys,zipfile; m=json.loads(zipfile.ZipFile(sys.argv[1]).read("BUILD-MANIFEST.json")); print(((m.get("release_readiness") or {}).get("desktop_acceptance") or {}).get("policy", ""))' "$zip")
        if [ "$policy" != generated_at_release ]; then
          echo "::notice::$TAG ships no generated desktop acceptance policy (it predates 0.1.3); no acceptance record is published."
          exit 0
        fi
        record="acceptance/nocpu-$version-acceptance.json"
        [ -f "$record" ] || { echo "::error::$TAG requires a desktop acceptance record and this run produced none"; exit 1; }
        python3 source/tools/desktop-acceptance.py verify --record "$record" --zip "$zip" --tag "$TAG"
        cp "$record" release-assets/
        (cd release-assets && sha256sum "nocpu-$version-acceptance.json" > "nocpu-$version-acceptance.json.sha256")
    - name: Refuse to publish without license notices and the matching source archive
      env:
        TAG: ${{ needs.resolve.outputs.tag }}
      run: |-
        python3 - <<'PY_GUARD'
        import json, os, pathlib, zipfile
        tag = os.environ['TAG']; version = tag[1:]
        assets = pathlib.Path('release-assets')
        required = [f'nocpu-{version}-web.zip', f'nocpu-{version}-web.zip.sha256',
                    f'nocpu-{version}-source.tar.gz', f'nocpu-{version}-source.tar.gz.sha256']
        missing = [name for name in required if not (assets / name).is_file()]
        if missing:
            raise SystemExit('Missing release assets: ' + ', '.join(missing))
        with zipfile.ZipFile(assets / f'nocpu-{version}-web.zip') as archive:
            names = set(archive.namelist())
            manifest = json.loads(archive.read('BUILD-MANIFEST.json')) if 'BUILD-MANIFEST.json' in names else {}
        if manifest.get('stage') != 'release' or manifest.get('tag') != tag or manifest.get('version') != version:
            raise SystemExit('Browser build manifest does not identify this tagged release')
        source = manifest.get('source_archive', {}).get('path', '')
        needed = {'notices/LICENSE', 'notices/THIRD_PARTY_NOTICES.md', 'notices/browser-license-audit.json',
                  source, source + '.sha256'}
        absent = sorted(name for name in needed if not name or name not in names)
        if absent:
            raise SystemExit('Browser build lacks notices or matching source: ' + ', '.join(absent))
        print('Notices and matching corresponding source present for', tag)
        PY_GUARD
    - name: Create or update the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.resolve.outputs.tag }}
      run: |-
        prerelease=false
        case "$TAG" in *-*) prerelease=true ;; esac
        shopt -s nullglob
        files=(release-assets/*.zip release-assets/*.tar.gz release-assets/*.json release-assets/*.sha256)
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release edit "$TAG" --title "NoCPU $TAG" --notes-file release-notes/notes.md --prerelease="$prerelease"
          gh release upload "$TAG" "${files[@]}" --clobber
        else
          flags=()
          if [ "$prerelease" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" --verify-tag --title "NoCPU $TAG" \
            --notes-file release-notes/notes.md "${flags[@]}"
        fi
  deploy-pages:
    needs:
    - resolve
    - verify
    - publish
    # Pre-release tags (any tag containing '-', such as v0.3.0-rc.1) publish a GitHub pre-release
    # with the same assets but never replace the stable Pages site.
    if: github.repository == 'jelloshooter848/NoCPU' && startsWith(needs.resolve.outputs.tag, 'v') && !contains(needs.resolve.outputs.tag, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Deploy the exact Pages artifact that passed the tagged release checks
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      with:
        # Named per attempt (github-pages-<sha>-<attempt>), so a re-run never
        # meets a duplicate "github-pages" artifact.
        artifact_name: ${{ needs.verify.outputs.pages_artifact }}
